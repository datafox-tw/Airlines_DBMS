<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錯誤 - Fly to Past</title>
    <style>
        body {
            text-align: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 100px;
            padding: 20px;
            background-color: white;
            display: inline-block;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 80%;
        }

        h2 {
            color: #ff4d4d;
            font-size: 36px;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        .error-details {
            background-color: #fff3f3;
            border-left: 5px solid #ff4d4d;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            font-family: monospace;
            word-wrap: break-word;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            text-decoration: none;
            color: white;
            background-color: #4CAF50;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            font-size: 18px;
            margin-top: 20px;
        }

        a:hover {
            background-color: #449048;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>哎呀！出錯了</h2>
        <p>資料庫操作或是系統執行時發生了錯誤：</p>
        
        <div class="error-details">
            {{ error_message }}
        </div>
        
        <p>請檢查您的輸入是否正確（例如 ID 是否存在），或者聯絡管理員。</p>
        
        <a href="{{ url_for('home') }}">回到首頁</a>
    </div>
</body>
</html>
